<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre da IA - RPG Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        h1, h2, .medieval-font {
            font-family: 'Cinzel', serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .choice-btn {
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            transform: translateX(5px);
            background: rgba(59, 130, 246, 0.2);
        }

        .scroll-custom::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-custom::-webkit-scrollbar-track {
            background: #1e293b;
        }

        .scroll-custom::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease forwards;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .setup-bubble {
            border-left: 4px solid #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            padding: 1rem;
            border-radius: 0 0.75rem 0.75rem 0;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Status Bar -->
    <nav class="glass-panel sticky top-0 z-50 p-4 border-b border-blue-900/30">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-dragon text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-widest uppercase text-blue-100">RPG Mestre IA</h1>
            </div>
            
            <!-- Atributos Dinâmicos -->
            <div id="dynamic-stats" class="flex flex-wrap gap-3 text-sm font-semibold">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Story & Actions -->
        <div class="md:col-span-2 flex flex-col gap-4">
            <div id="game-log" class="glass-panel rounded-xl p-6 h-[550px] overflow-y-auto scroll-custom flex flex-col gap-4">
                <div class="animate-fade">
                    <p class="text-blue-300 italic mb-2">Conexão estabelecida com o Plano Astral...</p>
                    <p class="text-lg leading-relaxed">Saudações, viajante. Para tecer as linhas do destino, precisamos primeiro definir as regras do seu mundo.</p>
                </div>
            </div>

            <!-- Input / Choice Area -->
            <div id="action-area" class="glass-panel rounded-xl p-4">
                <div id="choices-container" class="grid grid-cols-1 gap-2">
                    <button onclick="setupPhase()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all transform hover:scale-[1.02]">
                        INICIAR DEFINIÇÃO DO UNIVERSO
                    </button>
                </div>
                
                <div id="loading-indicator" class="hidden flex items-center justify-center py-4 gap-3">
                    <div class="loading-spinner"></div>
                    <span class="text-blue-400 font-medium">O Mestre está moldando a realidade...</span>
                </div>

                <div id="custom-action" class="hidden mt-4 pt-4 border-t border-slate-700">
                    <div class="flex gap-2">
                        <input type="text" id="free-text" placeholder="Responda ou solicite um atributo (ex: 'Adicione Magia')..." class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 text-slate-200">
                        <button onclick="handleFreeAction()" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition-colors">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Inventory & Stats Detail -->
        <div class="flex flex-col gap-6">
            <div class="glass-panel rounded-xl p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                    <i class="fa-solid fa-bag-shopping text-blue-400"></i> INVENTÁRIO
                </h2>
                <ul id="inventory-list" class="space-y-2 text-sm text-slate-300 max-h-40 overflow-y-auto scroll-custom">
                    <li class="italic text-slate-500">Mochila vazia...</li>
                </ul>
            </div>

            <div class="glass-panel rounded-xl p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b border-slate-700 pb-2">
                    <i class="fa-solid fa-scroll text-blue-400"></i> CRÔNICAS
                </h2>
                <div id="game-notes" class="text-sm text-slate-400 leading-relaxed italic whitespace-pre-wrap">
                    Aguardando criação...
                </div>
            </div>

            <button onclick="resetGame()" class="text-xs text-slate-500 hover:text-red-400 transition-colors self-end uppercase tracking-tighter">
                Aniquilar Realidade e Recomeçar
            </button>
        </div>
    </main>

    <script>
        const apiKey = ""; 
        
        let gameState = {
            stats: {}, // AGORA DINÂMICO: { "Vida": 100, "Magia": 50, etc }
            inventory: [],
            notes: "Criação pendente.",
            isSetup: true
        };

        const systemPrompt = `Você é um Mestre de RPG adaptável.

FLUXO DE SETUP (gameState.isSetup = true):
1. Pergunte Gênero/Tom.
2. SUGIRA ATRIBUTOS: Com base no gênero, sugira quais atributos farão parte da barra de status (ex: Fantasia -> Vida, Magia, Ouro. Sobrevivência -> Fome, Sede, Estamina). O jogador pode aceitar ou pedir novos.
3. RESUMO: Apresente o resumo do mundo e a LISTA DE ATRIBUTOS confirmada.
4. CONFIRMAÇÃO: Pergunte se pode começar.

REGRAS DE JSON:
- Responda EXCLUSIVAMENTE com JSON.
- No campo "stats_atualizados", envie o objeto COMPLETO de atributos com seus valores atuais.
- Se o jogador pedir para adicionar um atributo como "Magia", inclua-o no objeto "stats_atualizados" com um valor inicial coerente.

Estrutura:
{
  "narrativa": "string",
  "stats_atualizados": { "NomeAtributo": valor_numérico },
  "itens_ganhos": [],
  "itens_perdidos": [],
  "notas_atualizadas": "string",
  "isSetup": boolean,
  "opcoes": [{"id": "A", "texto": "string"}]
}`;

        function cleanAndParseJSON(rawText) {
            let cleaned = rawText.trim();
            cleaned = cleaned.replace(/^```json\s*/i, '').replace(/```\s*$/i, '');
            const firstBrace = cleaned.indexOf('{');
            const lastBrace = cleaned.lastIndexOf('}');
            if (firstBrace !== -1 && lastBrace !== -1) {
                cleaned = cleaned.substring(firstBrace, lastBrace + 1);
            }
            try {
                return JSON.parse(cleaned);
            } catch (e) {
                console.error("JSON Inválido:", cleaned);
                throw e;
            }
        }

        async function fetchGemini(userPrompt) {
            showLoading(true);
            const payload = {
                contents: [{ parts: [{ text: `Estado: ${JSON.stringify(gameState)}\nEntrada: ${userPrompt}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json", temperature: 0.8 }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Falha na API');
                const data = await response.json();
                const result = cleanAndParseJSON(data.candidates[0].content.parts[0].text);
                updateGameState(result);
            } catch (error) {
                showErrorMessage("O Mestre se perdeu em seus pensamentos. Tente novamente.");
            } finally {
                showLoading(false);
            }
        }

        function updateGameState(data) {
            if (!data) return;

            // Atualiza Atributos Dinâmicos
            if (data.stats_atualizados) {
                gameState.stats = data.stats_atualizados;
            }

            if (data.isSetup !== undefined) gameState.isSetup = !!data.isSetup;

            if (Array.isArray(data.itens_ganhos)) gameState.inventory.push(...data.itens_ganhos);
            if (Array.isArray(data.itens_perdidos)) {
                data.itens_perdidos.forEach(it => {
                    const idx = gameState.inventory.indexOf(it);
                    if (idx > -1) gameState.inventory.splice(idx, 1);
                });
            }

            if (data.notas_atualizadas) gameState.notes = data.notas_atualizadas;
            renderUI(data);
        }

        function getIconForStat(statName) {
            const name = statName.toLowerCase();
            if (name.includes('vida') || name.includes('hp') || name.includes('saude')) return 'fa-heart text-red-500';
            if (name.includes('magia') || name.includes('mana') || name.includes('foco')) return 'fa-wand-sparkles text-purple-400';
            if (name.includes('ouro') || name.includes('dinheiro') || name.includes('credito')) return 'fa-coins text-yellow-500';
            if (name.includes('folego') || name.includes('estamina') || name.includes('energia')) return 'fa-bolt text-blue-400';
            if (name.includes('fome') || name.includes('comida')) return 'fa-utensils text-orange-500';
            if (name.includes('oxigenio') || name.includes('ar')) return 'fa-wind text-cyan-300';
            if (name.includes('sanidade') || name.includes('mente')) return 'fa-brain text-pink-400';
            return 'fa-star text-slate-400';
        }

        function renderUI(data) {
            // Renderizar Stats na Nav
            const statsContainer = document.getElementById('dynamic-stats');
            statsContainer.innerHTML = '';
            Object.entries(gameState.stats).forEach(([name, value]) => {
                const div = document.createElement('div');
                div.className = 'stat-card animate-fade';
                div.innerHTML = `<i class="fa-solid ${getIconForStat(name)}"></i> <span>${value}</span> <span class="text-[10px] opacity-50 uppercase">${name}</span>`;
                statsContainer.appendChild(div);
            });

            // Log
            const log = document.getElementById('game-log');
            const newEntry = document.createElement('div');
            newEntry.className = 'animate-fade mb-6';
            const text = (data.narrativa || "").replace(/\n/g, '<br>');
            
            if (gameState.isSetup) {
                newEntry.innerHTML = `<div class="setup-bubble"><p class="text-blue-100 font-medium">${text}</p></div>`;
            } else {
                newEntry.innerHTML = `<p class="text-lg leading-relaxed text-slate-200">${text}</p>`;
            }
            log.appendChild(newEntry);
            log.scrollTop = log.scrollHeight;

            document.getElementById('game-notes').innerText = gameState.notes;

            // Itens
            const invList = document.getElementById('inventory-list');
            invList.innerHTML = gameState.inventory.length > 0 
                ? gameState.inventory.map(i => `<li><i class="fa-solid fa-circle-dot text-blue-500 text-[10px] mr-2"></i>${i}</li>`).join('')
                : '<li class="italic text-slate-500">Mochila vazia...</li>';

            // Opções
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            if (data.opcoes) {
                data.opcoes.forEach(opt => {
                    const btn = document.createElement('button');
                    const isStart = opt.texto.toLowerCase().includes("começar");
                    btn.className = `choice-btn w-full glass-panel border-l-4 ${isStart ? 'border-l-green-500' : 'border-l-blue-600'} p-4 rounded-r-lg hover:bg-slate-800 text-left`;
                    btn.innerHTML = `<span class="font-bold text-blue-400 mr-2">${opt.id}.</span> ${opt.texto}`;
                    btn.onclick = () => handleChoice(opt.texto);
                    choicesContainer.appendChild(btn);
                });
                document.getElementById('custom-action').classList.remove('hidden');
            }
        }

        async function setupPhase() {
            document.getElementById('game-log').innerHTML = '';
            await fetchGemini("Inicie a criação do universo. Sugira um gênero e os atributos iniciais que usaremos.");
        }

        async function handleChoice(text) {
            await fetchGemini(text);
        }

        async function handleFreeAction() {
            const input = document.getElementById('free-text');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await fetchGemini(text);
        }

        function showLoading(show) {
            document.getElementById('loading-indicator').classList.toggle('hidden', !show);
            document.getElementById('choices-container').style.opacity = show ? '0.5' : '1';
        }

        function showErrorMessage(msg) {
            const log = document.getElementById('game-log');
            log.innerHTML += `<div class="text-red-400 bg-red-950/20 p-3 rounded border border-red-900/50 my-2">${msg}</div>`;
        }

        function resetGame() {
            if (confirm("Isso destruirá este universo para sempre. Tem certeza?")) location.reload();
        }

        document.getElementById('free-text').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleFreeAction();
        });
    </script>
</body>
</html>
